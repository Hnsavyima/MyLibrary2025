<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Spectacles de la salle</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Spectacles programmés dans la salle <span th:text="${room.name}">Salle</span></h1>
    <p>Lieu : <strong th:text="${room.location.name}">Lieu</strong></p>
    <p>Capacité : <strong th:text="${room.seats}">0</strong> places</p>

    <table class="table table-striped" th:unless="${#lists.isEmpty(shows)}">
        <thead>
            <tr>
                <th>Titre</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="show : ${shows}">
                <td th:text="${show.title}">Titre</td>
                <td th:text="${show.description}">Description</td>
                <td>
                    <a th:href="@{/shows/{id}(id=${show.id})}" class="btn btn-sm btn-info">Voir les représentations</a>
                </td>
            </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(shows)}">Aucun spectacle prévu dans cette salle.</p>

    <a th:href="@{/locations/{id}(id=${room.location.id})}" class="btn btn-secondary mt-3">Retour au lieu</a>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Liste des artistes</title>
</head>
<body>
<div class="container">
    <div layout:fragment="content">
        <h1 th:text="${title}">Liste des artistes</h1>

        <table class="table table-striped" th:unless="${#lists.isEmpty(artists)}">
            <thead>
                <tr>
                    <th>Prénom</th>
                    <th>Nom</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="artist : ${artists}">
                    <td th:text="${artist.firstname}">Bob</td>
                    <td>
                        <a th:href="@{/artists/{id}(id=${artist.id})}" th:text="${artist.lastname}">Sull</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(artists)}">Aucun artiste trouvé.</p>
    </div>
</div>
</body>
</html>

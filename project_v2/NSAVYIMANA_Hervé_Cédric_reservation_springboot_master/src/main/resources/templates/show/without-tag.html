<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Spectacles sans mot-clé</title>
</head>
<body>
    <div class="container">
        <div id="notification" th:replace="~{main :: notification}"></div>
        <div layout:fragment="content">
            <h2 th:text="|Spectacles sans le mot-clé : '${tag}'|">Spectacles sans mot-clé</h2>

            <p th:text="|${#lists.size(shows)} spectacle(s) trouvé(s).|"></p>

            <table th:unless="${#lists.isEmpty(shows)}">
                <thead>
                    <tr>
                        <th>Titre</th>
                        <th>Lieu</th>
                        <th>Mots-clés</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="show : ${shows}">
                        <td th:text="${show.title}">Titre</td>
                        <td th:text="${show.location}">Lieu</td>
                        <td>
                            <span th:each="t, stat : ${show.tags}">
                                <span th:text="${t.tag}">tag</span><span th:if="!${stat.last}">, </span>
                            </span>
                            <span th:if="${#lists.isEmpty(show.tags)}">Aucun</span>
                        </td>
                        <td><a th:href="@{/shows/{id}(id=${show.id})}">Voir</a></td>
                    </tr>
                </tbody>
            </table>

            <p th:if="${#lists.isEmpty(shows)}">Aucun spectacle trouvé sans ce mot-clé.</p>

            <nav><a th:href="@{/shows}">Retour à la liste</a></nav>
        </div>
    </div>
</body>
</html>

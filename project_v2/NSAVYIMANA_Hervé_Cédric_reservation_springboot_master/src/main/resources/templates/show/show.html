<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/main}">
<head>
    <title>Fiche du spectacle</title>
</head>
<body>
    <div class="container">
        <div id="notification" th:replace="~{main :: notification}"></div>
        <div layout:fragment="content">
            <h2 th:text="${show.title}">Titre du spectacle</h2>

            <div>
                <p><strong>Description :</strong> <span th:text="${show.description}">Description</span></p>
                <p><strong>Lieu :</strong> <span th:text="${show.location}">Lieu</span></p>
            </div>

            <div>
                <h3>Mots-clés</h3>
                <p th:if="${#lists.isEmpty(show.tags)}">Aucun mot-clé associé à ce spectacle.</p>
                <ul th:unless="${#lists.isEmpty(show.tags)}">
                    <li th:each="tag : ${show.tags}" th:text="${tag.tag}">tag</li>
                </ul>
            </div>

            <div sec:authorize="hasRole('ADMIN')">
                <h3>Ajouter un mot-clé</h3>
                <form th:action="@{/shows/{id}/tags(id=${show.id})}" method="post">
                    <div>
                        <label for="tagName">Mot-clé :</label>
                        <input type="text" id="tagName" name="tagName" maxlength="30" required placeholder="Entrez un mot-clé">
                    </div>
                    <div>
                        <button type="submit">Ajouter</button>
                    </div>
                </form>
            </div>

            <nav><a th:href="@{/shows}">Retour à la liste</a></nav>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Liste des spectacles</title>
</head>
<body>
    <div class="container">
        <div id="notification" th:replace="~{main :: notification}"></div>
        <div layout:fragment="content">
            <h2 th:text="${title}">Liste des spectacles</h2>

            <form method="get" th:action="@{/shows}">
                <div>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Rechercher par mot-clé...">
                    <button type="submit">Rechercher</button>
                    <a th:if="${keyword != null}" th:href="@{/shows}">Réinitialiser</a>
                </div>
            </form>

            <div th:if="${keyword != null}">
                <p th:text="|${totalResults} résultat(s) pour le mot-clé : '${keyword}'|"></p>
            </div>

            <table th:unless="${#lists.isEmpty(shows)}">
                <thead>
                    <tr>
                        <th>Titre</th>
                        <th>Lieu</th>
                        <th>Mots-clés</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="show : ${shows}">
                        <td th:text="${show.title}">Titre</td>
                        <td th:text="${show.location}">Lieu</td>
                        <td>
                            <span th:each="tag, stat : ${show.tags}">
                                <span th:text="${tag.tag}">tag</span><span th:if="!${stat.last}">, </span>
                            </span>
                        </td>
                        <td><a th:href="@{/shows/{id}(id=${show.id})}">Voir</a></td>
                    </tr>
                </tbody>
            </table>

            <p th:if="${#lists.isEmpty(shows)}">Aucun spectacle trouvé.</p>
        </div>
    </div>
</body>
</html>
